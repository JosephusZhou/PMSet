name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Build universal binary
        run: swift build -c release --arch x86_64 --arch arm64
      - name: Generate icon
        run: |
          if [ ! -f "PMSet.icns" ]; then
            swift make-icon.swift
            rm -rf icon.iconset && mkdir -p icon.iconset
            sips -z 16 16 icon-1024.png --out icon.iconset/icon_16x16.png >/dev/null
            sips -z 32 32 icon-1024.png --out icon.iconset/icon_16x16@2x.png >/dev/null
            sips -z 32 32 icon-1024.png --out icon.iconset/icon_32x32.png >/dev/null
            sips -z 64 64 icon-1024.png --out icon.iconset/icon_32x32@2x.png >/dev/null
            sips -z 128 128 icon-1024.png --out icon.iconset/icon_128x128.png >/dev/null
            sips -z 256 256 icon-1024.png --out icon.iconset/icon_128x128@2x.png >/dev/null
            sips -z 256 256 icon-1024.png --out icon.iconset/icon_256x256.png >/dev/null
            sips -z 512 512 icon-1024.png --out icon.iconset/icon_256x256@2x.png >/dev/null
            sips -z 512 512 icon-1024.png --out icon.iconset/icon_512x512.png >/dev/null
            cp icon-1024.png icon.iconset/icon_512x512@2x.png
            iconutil -c icns icon.iconset -o PMSet.icns
            rm -rf icon.iconset icon-1024.png
          fi
      - name: Assemble app
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          APP=PMSet.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/apple/Products/Release/PMSet "$APP/Contents/MacOS/PMSet"
          cp PMSet.icns "$APP/Contents/Resources/PMSet.icns"
          cp Info.plist "$APP/Contents/Info.plist"
          if [[ -n "$VERSION" ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          fi
          codesign --force --sign - "$APP"
          file "$APP/Contents/MacOS/PMSet"
      - name: Package DMG (arm64)
        continue-on-error: true
        id: dmg_arm64
        run: |
          APP="PMSet-arm64.app"
          rm -rf "$APP"
          cp -r PMSet.app "$APP"
          lipo -extract arm64 "$APP/Contents/MacOS/PMSet" -output "$APP/Contents/MacOS/PMSet"
          file "$APP/Contents/MacOS/PMSet"
          codesign --force --sign - "$APP"
          hdiutil create -volname "PMSet" -srcfolder "$APP" -ov -format UDZO "PMSet-arm64.dmg"
          rm -rf "$APP"
      - name: Package DMG (x86_64)
        continue-on-error: true
        id: dmg_x86_64
        run: |
          APP="PMSet-x86_64.app"
          rm -rf "$APP"
          cp -r PMSet.app "$APP"
          lipo -extract x86_64 "$APP/Contents/MacOS/PMSet" -output "$APP/Contents/MacOS/PMSet"
          file "$APP/Contents/MacOS/PMSet"
          codesign --force --sign - "$APP"
          hdiutil create -volname "PMSet" -srcfolder "$APP" -ov -format UDZO "PMSet-x86_64.dmg"
          rm -rf "$APP"
      - name: Verify DMGs
        run: |
          if [ ! -f "PMSet-arm64.dmg" ] && [ ! -f "PMSet-x86_64.dmg" ]; then
            echo "Both DMG builds failed"
            exit 1
          fi
          ls -lh *.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PMSet-dmg
          path: "*.dmg"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: PMSet-dmg
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.dmg"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
